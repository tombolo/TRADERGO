        <script>
            (function () {
                try {
                    var path = window.location.pathname;
                    if (path !== '/' && path !== '') return;

                    var loginid = localStorage.getItem('active_loginid');
                    var accountsList = JSON.parse(localStorage.getItem('accountsList') || '{}');
                    var hasLocalSession =
                        loginid && loginid !== 'oauth_session' && accountsList[loginid];

                    var authRaw = sessionStorage.getItem('auth_info');
                    var hasOAuthSession = false;
                    if (authRaw) {
                        var authInfo = JSON.parse(authRaw);
                        hasOAuthSession =
                            authInfo &&
                            authInfo.access_token &&
                            (!authInfo.expires_at || Date.now() < authInfo.expires_at);
                    }

                    if (!hasLocalSession && !hasOAuthSession) return;

                    var siteKey = function () {
                        var h = location.hostname.toLowerCase();
                        if (h === 'localhost' || h === '127.0.0.1') return h;
                        var p = h.split('.');
                        return p.length >= 2 ? p.slice(-2).join('.') : h;
                    };
                    var storedOrigin = localStorage.getItem('auth_site_origin');
                    var currentOrigin = siteKey();
                    if (
                        storedOrigin &&
                        storedOrigin !== currentOrigin &&
                        (storedOrigin === 'smarttraderstool.com' ||
                            storedOrigin === 'smartderiv.pro' ||
                            storedOrigin === 'pipstrades.pro')
                    ) {
                        localStorage.removeItem('active_loginid');
                        localStorage.removeItem('accountsList');
                        localStorage.removeItem('clientAccounts');
                        localStorage.removeItem('authToken');
                        sessionStorage.removeItem('auth_info');
                        return;
                    }

                    var hash = (window.location.hash || '').replace(/^#\/?/, '').split(/[?/]/)[0];
                    var appTabs = [
                        'dashboard',
                        'bot_builder',
                        'free_bots',
                        'bulk_trader',
                        'trader',
                        'copy_trading',
                        'chart',
                        'analysis_tools',
                    ];
                    var target = '/app#dashboard';
                    if (hash && appTabs.indexOf(hash) !== -1) {
                        target = '/app#' + hash;
                    }
                    window.location.replace(target);
                } catch (e) {
                    /* ignore — React router handles fallback */
                }
            })();
        </script>

        <!-- DevTools protection (large screens, production only) — runs before React boots -->
        <script src="/scripts/devtools-blocked.js"></script>
        <script>
            (function () {
                var host = location.hostname.toLowerCase();
                var isLocal = host === 'localhost' || host === '127.0.0.1';
                var LARGE_SCREEN_MIN_WIDTH = 1280;
                var DEVTOOLS_THRESHOLD = 160;

                function isMobileBrowser() {
                    var ua = navigator.userAgent || '';
                    if (/iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                        return true;
                    }
                    return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
                }

                function isLargeScreen() {
                    return window.innerWidth >= LARGE_SCREEN_MIN_WIDTH;
                }

                function isDevToolsOpen() {
                    var widthGap = window.outerWidth - window.innerWidth;
                    var heightGap = window.outerHeight - window.innerHeight;
                    return widthGap > DEVTOOLS_THRESHOLD || heightGap > DEVTOOLS_THRESHOLD;
                }

                function isProtectionEnabled() {
                    if (isLocal) return false;
                    if (isMobileBrowser()) return false;
                    if (!isLargeScreen()) return false;
                    return true;
                }

                if (!isProtectionEnabled()) return;

                if (isDevToolsOpen()) {
                    window.__DEVTOOLS_BLOCKED__ = true;
                    if (typeof window.renderDevToolsBlockedScreen === 'function') {
                        window.renderDevToolsBlockedScreen();
                    }
                    return;
                }

                document.addEventListener('contextmenu', function (event) {
                    event.preventDefault();
                });

                document.addEventListener(
                    'keydown',
                    function (event) {
                        var key = (event.key || '').toLowerCase();
                        if (key === 'f12') {
                            event.preventDefault();
                            event.stopPropagation();
                            return;
                        }
                        var usesPrimary = event.ctrlKey || event.metaKey;
                        if (!usesPrimary) return;
                        var usesSecondary = event.shiftKey || event.altKey;
                        if (usesSecondary && (key === 'i' || key === 'j' || key === 'c')) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        if (event.ctrlKey && key === 'u') {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                    },
                    true
                );
            })();
        </script>
